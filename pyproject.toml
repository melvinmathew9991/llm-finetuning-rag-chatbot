[project]
name = "llm-finetuning-rag-chatbot"
version = "0.1.0"
description = "LLM fine-tuning (full + LoRA/PEFT) notebook and a RAG shopping chatbot (OpenAI/Ollama)"
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
